name: Coverage
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
jobs:
  coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test,encrypt]
      - name: Test
        run: |
          python -m coverage run
          if python -m coverage json ; then
            echo "COLOR=green" >> $GITHUB_ENV
          else
            echo "COLOR=red" >> $GITHUB_ENV
          fi

          CMD="import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'] + '%')"
          echo "COVERAGE=$(python -c "$CMD")" >> $GITHUB_ENV

          REF=${{ github.ref }}
          echo "github.ref: $REF"
          IFS='/' read -ra PATHS <<< "$REF"
          BRANCH_NAME="${PATHS[1]}_${PATHS[2]}"
          echo $BRANCH_NAME
          echo "BRANCH=$(echo ${BRANCH_NAME})" >> $GITHUB_ENV
      - name: Upload test configuration
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testing.${{ matrix.python-version }}
          path: |
            coverage.json
            .coverage
      - name: Create badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 36d9705addcd44fb0fccec1d23dc1338
          filename: flask-htmx-template__${{ env.BRANCH }}.svg
          label: Test Coverage
          message: ${{ env.COVERAGE }}
          color: ${{ env.COLOR }}
          namedLogo: Coverage
