[build-system]
requires = [
  "setuptools>=77",
  "setuptools-scm>=8",
  "flask",
  "flask-assets",
  "pytailwindcss",
  "jsmin",
]
build-backend = "setuptools.build_meta"

[project]
name = "flask-htmx-template"
dynamic = ["version"]
dependencies = [
  "sqlalchemy>=2,!=2.0.50",    # 2.0.50 has an accidental debug print in pysqlcipher dialect; remove when 2.0.51 ships (sqlalchemy/sqlalchemy#13349)
  "colorama",
  "flask>=3",
  "flask-assets",
  "flask-login",
  "argcomplete",
  "prometheus-flask-exporter",
  "packaging",
  "tqdm",
  "materialyoucolor>=3.0.2",
]
description = "A template repository for flask with htmx"
license = "MIT"
readme = "README.md"
authors = [{ name = "Bradley Davis", email = "me@bradleydavis.tech" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12"

[project.scripts]
flask_htmx_template = "flask_htmx_template.main:main"

[project.urls]
Homepage = "https://github.com/WattsUp/flask_htmx_template"
Repository = "https://github.com/WattsUp/flask_htmx_template.git"
Issues = "https://github.com/WattsUp/flask_htmx_template/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]"]
deploy = ["gunicorn"]
test = [
  "pytest",
  "coverage",
  "numpy",
  "time-machine",
  "tomli",
  "pytailwindcss",
  "jsmin",
  "setuptools>=77",
  "pytest-postgresql",
]
dev = [
  "flask-htmx-template[deploy,test,postgres]",
  "ruff>=0.15.20",
  "codespell>=2.4.1",
  "black>=26.5",
  "isort",
  "prek",
  "djlint>=1.36.4",
  "basedpyright>=1.38.0",
  "taplo",
]
build = ["build"]
build-docker = ["flask-htmx-template[build]", "setuptools-scm>=8"]

[tool.black]
target-version = ["py312", "py313"]
preview = true

[tool.codespell]
skip = "3rd-party,dist,*.pem,*.json"
ignore-words-list = ["initialY"]

[tool.coverage.run]
command_line = "-m pytest tests"
branch = true
source = ["flask_htmx_template"]

[tool.coverage.report]
ignore_errors = true
precision = 2
show_missing = true
fail_under = 100
exclude_lines = [
  "pragma: no cover", # Have to re-enable the standard pragma

  # Don't complain about missing debug-only code:
  "def __repr__",
  "if self.debug",

  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
  "case _:",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if False:",
  "if __name__ == .__main__.:",

  # Don't complain about the one win32 line
  "if sys.platform == .win32.:",

  # Don't complain about ImportErrors, unit tests mocks them
  "except ImportError",

  # Don't complain about missing typing hints
  "if TYPE_CHECKING:",

  # Don't need to test guard code
  "raise exc.UnboundExecutionError",

  # Overloads have branch issues
  "@overload",

  # TypeErrors are just typing insurance, should never get reached
  "TypeError",
]

[tool.djlint]
extension = "jinja"
profile = "jinja"
ignore = "H020"

[tool.isort]
profile = "black"
skip_gitignore = true
float_to_top = true
force_alphabetical_sort_within_sections = true

[tool.basedpyright]
include = ["flask_htmx_template", "tests", "tools", "typings"]
exclude = ["**/__pycache__"]
venvPath = "."
typeCheckingMode = "strict"

reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

# Checked by ruff
reportPrivateUsage = "none"

[tool.pytest.ini_options]
addopts = ["--durations=10", "--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
exclude = ["typings"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
future-annotations = true

ignore = [
  "line-contains-todo",                # Permit TODOs
  "unsorted-imports",                  # mismatch between ruff and isort
  "missing-copyright-notice",          # No copyright
  "undocumented-public-package",       # Missing docstring in public package
  "incorrect-blank-line-before-class", # No blank line before pydocs
  "multi-line-summary-second-line",    # Summary on not on second line
]

[tool.ruff.lint.per-file-ignores]
"docker/*.py" = [
  "undocumented-public-module",    # Disable missing docstrings in tests
  "implicit-namespace-package",    # Implicit namespace
  "hardcoded-bind-all-interfaces", # binding to 0.0.0.0
]
"flask_htmx_template/database.py" = [
  "private-member-access", # Allow self for reloading
]
"flask_htmx_template/commands/*.py" = [
  "print",                    # Allow printing for commands
  "import-outside-top-level", # Allow imports outside of top for faster time to main
]
"flask_htmx_template/controllers/api_docs/ctx.py" = [
  "blind-except", # Allow blind except
]
"flask_htmx_template/models/base_uri.py" = [
  "global-statement", # Allow global CIPHER
]
"flask_htmx_template/migrations/v*.py" = [
  "invalid-class-name", # Allow underscore in class name for version names
]
"tests/**/*.py" = [
  "undocumented-public-module",                # Disable missing docstrings in tests
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-magic-method",
  "undocumented-public-nested-class",
  "undocumented-public-init",
  "hardcoded-sql-expression",                  # Disable possible SQL injection
  "import-private-name",                       # Private import
  "suspicious-subprocess-import",              # subprocess import
  "assert",                                    # Uses asserts in pytest
  "suspicious-non-cryptographic-random-usage", # Uses random in pytest
  "magic-value-comparison",                    # Uses magic numbers in pytest
  "boolean-type-hint-positional-argument",     # Boolean positional arguments
  "print",                                     # Allow printing for extra context
  "private-member-access",                     # Allow access to privates
  "unused-function-argument",                  # Allow unused arguments for fixtures
  "too-many-arguments",                        # Allow many arguments
  "too-many-positional-arguments",             # Allow many arguments
]
"tests/controllers/*.py" = [
  "invalid-function-name", # Allow CAPS methods
]
"tests/mock*.py" = [
  "raise-vanilla-class", # Allow base Exception
]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "sqlalchemy.orm.DeclarativeBase",
  "flask_htmx_template.models.base.Base",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.ruff]
strictly-empty-init-modules = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["flask_htmx_template*"]
namespaces = false

[tool.setuptools.cmdclass]
build_py = "flask_htmx_template.web_assets.BuildAssets"

[tool.setuptools.package-data]
flask_htmx_template = [
  "static/dist/**/*",
  "static/fonts/**/*",
  "static/img/**/*",
  "templates/**/*",
]

[tool.setuptools_scm]
version_file = "flask_htmx_template/version.py"

[dependency-groups]
dev = ["materialyoucolor>=3.0.2"]
