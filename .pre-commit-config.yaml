default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/DetachHead/basedpyright-prek-mirror
    rev: 1.39.10
    hooks:
      - id: basedpyright
        language: system
  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^LICENSE|\.(html|csv|txt|svg|py)$
      - id: fix-byte-order-marker
        exclude: ^tests/data
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: pretty-format-json
        args: ["--autofix", "--no-ensure-ascii", "--no-sort-keys"]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.(html|svg)$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^tests/data
        additional_dependencies:
          - tomli
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.44.2
    hooks:
      - id: djlint-jinja
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: grep-console
        name: grep-console
        entry: console.log
        language: pygrep
        files: \.(jinja|css|js)$
      - id: grep-unittest
        name: grep-unittest
        entry: '\bunittest\b(?!\.mock\b)'
        language: pygrep
        files: \.py$
      - id: no-unicode-dashes
        name: no-unicode-dashes
        # NOTE: yamlfmt emits literal characters, so this hook must exclude its config.
        entry: "–|—|‒|―|−|﹘|﹣|－"
        language: pygrep
        files: \.(py|jinja|js|css|sh|toml|yaml|yml|md|adoc|rst|txt)$
        exclude: ^\.pre-commit-config\.yaml$
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: node
        files: \.(md|jinja|css|js)$
      - id: remove-test-phase-comments
        name: remove test phase comments
        entry: >-
          sed -i -E '/^[[:space:]]*#[[:space:]]*(Arrange|Act|Assert)[[:space:]]*$/Id'
        language: system
        files: ^tests/.*\.py$
      - id: vale
        name: vale
        entry: vale
        language: system
        files: \.(md|rst|txt|adoc)$
